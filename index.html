<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16766f">
  <meta name="description" content="適合2至4位國小學生一起玩的SEL情緒成語三關桌遊。">
  <meta name="application-name" content="SEL 成語心情冒險">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="心情冒險">
  <title>SEL × 成語｜心情冒險</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316766f'/%3E%3Ccircle cx='32' cy='32' r='21' fill='%23f7c948'/%3E%3Ccircle cx='25' cy='28' r='2.5' fill='%2320302f'/%3E%3Ccircle cx='39' cy='28' r='2.5' fill='%2320302f'/%3E%3Cpath d='M22 38c6 7 14 7 20 0' fill='none' stroke='%2320302f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <dialog id="rulesDialog" class="dialog">
    <button class="dialog-close" type="button" aria-label="關閉規則" onclick="closeRules()">×</button>
    <div id="rulesContent"></div>
  </dialog>
  <dialog id="confirmDialog" class="dialog dialog-small">
    <h2>要重新開始嗎？</h2>
    <p>目前的遊戲進度會清除。</p>
    <div class="dialog-actions">
      <button class="btn ghost" type="button" onclick="document.getElementById('confirmDialog').close()">繼續遊戲</button>
      <button class="btn danger" type="button" onclick="resetGame()">重新開始</button>
    </div>
  </dialog>
  <dialog id="idiomDatabaseDialog" class="dialog idiom-database-dialog">
    <button class="dialog-close" type="button" aria-label="關閉成語資料庫" onclick="closeIdiomDatabase()">×</button>
    <div id="idiomDatabaseContent"></div>
  </dialog>
  <dialog id="certificateDialog" class="dialog certificate-dialog">
    <button class="dialog-close" type="button" aria-label="關閉參與證書" onclick="closeCertificate()">×</button>
    <div id="certificateContent"></div>
  </dialog>
  <dialog id="installDialog" class="dialog dialog-small install-dialog">
    <button class="dialog-close" type="button" aria-label="關閉安裝說明" onclick="closeInstallHelp()">×</button>
    <span class="stage-pill">可離線使用</span>
    <h2>安裝「心情冒險」</h2>
    <div id="installStatus" class="install-status" aria-live="polite"></div>
    <ol class="install-steps">
      <li>請使用 <strong>Safari</strong> 開啟遊戲網址。</li>
      <li>點 Safari 工具列的<strong>「分享」</strong>按鈕。</li>
      <li>選擇<strong>「加入主畫面」</strong>，再點右上角的<strong>「加入」</strong>。</li>
      <li>看到「心情冒險」圖示後，先在線上開啟一次；之後沒有網路也能玩。</li>
    </ol>
    <div class="dialog-actions">
      <button id="installNowButton" class="btn" type="button" onclick="promptPwaInstall()" hidden>立即安裝</button>
      <button class="btn secondary" type="button" onclick="closeInstallHelp()">我知道了</button>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
